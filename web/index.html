<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Клиника монстров №13</title>
		<style>
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
			}

			body {
				background-color: #090f10;
				color: #e4d9b7;
				font-family: "DejaVu Sans Mono", "Courier New", monospace;
				overflow: hidden;
				touch-action: none;
			}

			#canvas {
				display: block;
				width: 100%;
				height: 100%;
				image-rendering: pixelated;
				outline: none;
			}

			#status {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.1rem;
				background-color: #090f10;
				transition: opacity 0.45s ease;
			}

			#status.hidden {
				opacity: 0;
				pointer-events: none;
			}

			#status-title {
				color: #d4ad59;
				letter-spacing: 0.35em;
				font-size: 0.85rem;
			}

			#status-bar {
				width: min(60vw, 420px);
				height: 12px;
				padding: 2px;
				border: 1px solid #75604a;
				background-color: #111a18;
			}

			#status-fill {
				width: 0%;
				height: 100%;
				background-color: #88aa66;
				transition: width 0.2s ease;
			}

			#status-note {
				max-width: 34rem;
				padding: 0 1rem;
				color: #9a9b7d;
				font-size: 0.75rem;
				line-height: 1.6;
				text-align: center;
			}

			#status-note.error {
				color: #b9554f;
			}

			#status-hint {
				color: #9a9b7d;
				font-size: 0.7rem;
			}

			#audio-hint {
				position: fixed;
				left: 0.75rem;
				bottom: 0.75rem;
				max-width: min(70vw, 30rem);
				padding: 0.4rem 0.6rem;
				border: 1px solid #75604a;
				background-color: rgba(17, 26, 24, 0.92);
				color: #9a9b7d;
				font-size: 0.68rem;
				line-height: 1.5;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.5s ease;
			}

			#audio-hint.visible {
				opacity: 1;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas" tabindex="0">Ваш браузер не поддерживает элемент canvas.</canvas>

		<div id="status">
			<div id="status-title">КЛИНИКА МОНСТРОВ №13</div>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-note">Открываем ночную смену…</div>
			<div id="status-hint">ОСМОТР → КНИГА → ЛЕЧЕНИЕ · клавиши 1–5, ПРОБЕЛ, M</div>
		</div>

		<div id="audio-hint">
			Звук в упрощённом режиме: AudioWorklet работает только по HTTPS или на localhost.
			Откройте игру по HTTPS, чтобы включить полный звук.
		</div>

		<noscript>Для запуска игры нужен JavaScript.</noscript>

		<script type="module" src="index.js"></script>
	</body>
</html>
